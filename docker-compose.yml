services:
  nexora:
    build: .
    image: nexora-evidence:latest
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    volumes:
      - nexora_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  nexora_data: